[package]
name = "thirdc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thirdc-desktop"
path = "src/main.rs"

# 移动端（Android/iOS）构建需要库目标：cdylib 进 APK、staticlib 进 Xcode 工程
[lib]
name = "thirdc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = [] }
kernel-core = { path = "../kernel/crates/kernel-core" }
thirdc-server = { path = "../server" }
tokio.workspace = true
anyhow.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
