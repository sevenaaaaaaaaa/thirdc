<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThirdC Studio</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#151a22; --bg3:#1b222c; --line:#242c38;
    --fg:#e6edf3; --dim:#8b98a9; --accent:#5b9dff; --accent2:#7c5cff;
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);display:flex;overflow:hidden}
  aside{width:290px;flex:0 0 290px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:14px 16px 10px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
  .brand b{font-size:14px;letter-spacing:.2px}
  .brand span{color:var(--dim);font-size:11px;margin-left:auto}
  .search{padding:10px 12px}
  .search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);outline:none}
  .search input:focus{border-color:var(--accent)}
  .list{flex:1;overflow:auto;padding:4px 8px 0}
  .item{padding:8px 10px;border-radius:8px;cursor:pointer;display:block;border:1px solid transparent}
  .item:hover{background:var(--bg3)}
  .item.active{background:var(--bg3);border-color:var(--line)}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .p{color:var(--dim);font-size:11px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot{border-top:1px solid var(--line);padding:8px 12px;color:var(--dim);font-size:11px;line-height:1.8}
  .side-foot b{color:var(--fg);font-weight:600}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .toolbar .path{font-family:var(--mono);color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1}
  button{background:var(--bg3);color:var(--fg);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:#33415a;background:#212a36}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
  button.primary:disabled{opacity:.45;cursor:default}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:transparent;padding:5px 10px}
  .seg button.on{background:var(--bg3);color:var(--accent)}
  .workspace{flex:1;display:flex;min-height:0}
  textarea{flex:1;resize:none;border:none;outline:none;background:var(--bg);color:var(--fg);padding:22px 26px;font:14px/1.75 var(--mono)}
  .preview{flex:1;min-width:0;background:#fff}
  .preview iframe{width:100%;height:100%;border:none;display:block}
  .hidden{display:none!important}
  .empty{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:40px}
  .empty h2{color:var(--fg);font-weight:600;margin:0 0 6px}
  .statusbar{height:30px;flex:0 0 30px;border-top:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:11px;display:flex;align-items:center;gap:14px;padding:0 14px;font-family:var(--mono)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
  #toast{position:fixed;right:18px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--accent);padding:9px 13px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px #0008;max-width:340px}
  .toast.err{border-left-color:var(--err)}
  .toast.ok{border-left-color:var(--ok)}
  .hint{color:var(--dim);font-size:11px;padding:0 12px 8px}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">3C</div><b>ThirdC Studio</b><span id="proto">kernel</span></div>
  <div class="search"><input id="q" placeholder="检索知识库…  (FTS5 · 中文可查)"></div>
  <div class="list" id="list"></div>
  <div class="side-foot">
    <div>库：<b id="vault">—</b></div>
    <div>文档 <b id="nDocs">0</b> · 索引 <b id="nIdx">0</b> · 附件 <b id="nAssets">0</b></div>
  </div>
</aside>
<main>
  <div class="toolbar">
    <button id="new">＋ 新建</button>
    <span class="path" id="curPath">未选择文档</span>
    <span class="grow"></span>
    <div class="seg">
      <button id="mEdit">编辑</button>
      <button id="mSplit" class="on">双栏</button>
      <button id="mView">预览</button>
    </div>
    <button id="sync">同步</button>
    <button id="save" class="primary" disabled>保存</button>
  </div>
  <div class="workspace" id="ws">
    <textarea id="editor" spellcheck="false" placeholder="选择或新建一篇文档开始写作…&#10;&#10;粘贴图片可直接入库（内容寻址 + 引用登记）。" disabled></textarea>
    <div class="preview" id="previewWrap"><iframe id="preview" sandbox="" title="AI-HTML 预览"></iframe></div>
  </div>
  <div class="empty" id="empty">
    <div>
      <h2>AI Native 知识工作台</h2>
      <div>左侧选择文档 · 中间写作 · 右侧是 AI-HTML 渲染（沙箱执行）</div>
    </div>
  </div>
  <div class="statusbar">
    <span><span class="dot"></span><span id="conn">connected</span></span>
    <span id="stat">—</span>
    <span class="grow"></span>
    <span>⌘S 保存 · 粘贴图片自动入库</span>
  </div>
</main>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let token = params.get('token') || localStorage.getItem('thirdc_token') || '';
if (params.get('token')) localStorage.setItem('thirdc_token', token);
let docs = [], current = null, dirty = false, mode = 'split';

function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .4s'; }, 2200);
  setTimeout(()=>el.remove(), 2800);
}

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if (token) headers['authorization'] = 'Bearer ' + token;
  if (opts.json !== undefined){
    headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(opts.json);
  }
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = {raw:text}; }
  if (!res.ok) throw new Error(data.error || res.status + ' ' + res.statusText);
  return data;
}

async function refreshStatus(){
  try{
    const s = await api('/status');
    $('vault').textContent = s.vault; $('nDocs').textContent = s.docs;
    $('nIdx').textContent = s.indexed; $('nAssets').textContent = s.assets;
    $('conn').textContent = 'connected';
    $('stat').textContent = `${s.docs} docs · ${s.indexed} indexed · ${s.assets} assets · ${s.root}`;
  }catch(e){ $('conn').textContent = 'error: ' + e.message; }
}

async function refreshDocs(){
  const r = await api('/docs');
  docs = r.docs;
  const list = $('list'); list.innerHTML = '';
  docs.forEach(d => {
    const el = document.createElement('div');
    el.className = 'item' + (current === d.path ? ' active' : '');
    el.innerHTML = `<div class="t"></div><div class="p"></div>`;
    el.querySelector('.t').textContent = d.title || d.path.split('/').pop();
    el.querySelector('.p').textContent = d.path;
    el.onclick = () => openDoc(d.path);
    list.appendChild(el);
  });
}

async function openDoc(path){
  try{
    const d = await api('/doc?path=' + encodeURIComponent(path));
    current = path; dirty = false;
    $('curPath').textContent = path;
    $('editor').value = d.markdown; $('editor').disabled = false;
    $('preview').srcdoc = d.html;
    $('save').disabled = true;
    $('empty').classList.add('hidden'); $('ws').classList.remove('hidden');
    applyMode();
    refreshDocs();
  }catch(e){ toast('打开失败：' + e.message, 'err'); }
}

async function saveDoc(){
  if (!current) return;
  try{
    await api('/doc?path=' + encodeURIComponent(current), {method:'PUT', body: $('editor').value, headers:{'content-type':'text/markdown'}});
    dirty = false; $('save').disabled = true;
    toast('已保存 ' + current, 'ok');
    await openDoc(current);
    await refreshStatus();
  }catch(e){ toast('保存失败：' + e.message, 'err'); }
}

function applyMode(){
  const showEdit = mode !== 'view', showView = mode !== 'edit';
  $('editor').classList.toggle('hidden', !showEdit);
  $('previewWrap').classList.toggle('hidden', !showView);
  $('mEdit').classList.toggle('on', mode==='edit');
  $('mSplit').classList.toggle('on', mode==='split');
  $('mView').classList.toggle('on', mode==='view');
}

$('mEdit').onclick = () => { mode='edit'; applyMode(); };
$('mSplit').onclick = () => { mode='split'; applyMode(); };
$('mView').onclick = () => { mode='view'; applyMode(); };
$('save').onclick = saveDoc;
$('sync').onclick = async () => { const r = await api('/sync',{method:'POST'}); toast(`同步完成：合入 ${r.changed} 篇外部改动`); await refreshDocs(); await refreshStatus(); if(current) openDoc(current); };

$('new').onclick = async () => {
  const title = prompt('新文档标题', '未命名'); if(!title) return;
  const slug = title.replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase() || ('note-' + Date.now());
  const path = 'Notes/' + slug + '.md';
  try{
    await api('/doc?path=' + encodeURIComponent(path), {method:'PUT', body:'# ' + title + '\n\n', headers:{'content-type':'text/markdown'}});
    await refreshDocs(); await refreshStatus(); openDoc(path);
  }catch(e){ toast('创建失败：' + e.message, 'err'); }
};

$('editor').addEventListener('input', () => { dirty = true; $('save').disabled = false; });
document.addEventListener('keydown', e => { if((e.metaKey||e.ctrlKey) && e.key==='s'){ e.preventDefault(); saveDoc(); } });

$('editor').addEventListener('paste', async (e) => {
  const files = [...(e.clipboardData?.files||[])];
  const img = files.find(f => f.type.startsWith('image/'));
  if(!img) return;
  e.preventDefault();
  const buf = new Uint8Array(await img.arrayBuffer());
  try{
    const r = await api('/asset?name=' + encodeURIComponent('paste.' + (img.type.split('/')[1]||'png')), {method:'POST', body: buf, headers:{'content-type':'application/octet-stream'}});
    insert('' + r.markdown + '\n');
    toast('图片已入库 ' + r.hash.slice(0,10) + '…（内容寻址）', 'ok');
    await refreshStatus();
  }catch(err){ toast('图片入库失败：' + err.message, 'err'); }
});
function insert(text){
  const t = $('editor'); const s = t.selectionStart, e2 = t.selectionEnd;
  t.value = t.value.slice(0,s) + text + t.value.slice(e2);
  t.selectionStart = t.selectionEnd = s + text.length;
  dirty = true; $('save').disabled = false; t.focus();
}

let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = $('q').value.trim();
    if(!q){ refreshDocs(); return; }
    const r = await api('/search?q=' + encodeURIComponent(q));
    const list = $('list'); list.innerHTML = '';
    if(!r.hits.length){ list.innerHTML = '<div class="hint">无匹配结果</div>'; return; }
    r.hits.forEach(h => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = '<div class="t"></div><div class="p"></div>';
      el.querySelector('.t').textContent = h.path.split('/').pop();
      el.querySelector('.p').textContent = h.path + '  ·  rank ' + h.rank.toFixed(2);
      el.onclick = () => openDoc(h.path);
      list.appendChild(el);
    });
  }, 180);
});

(async function init(){ await refreshDocs(); await refreshStatus(); })();
</script>
</body>
</html>
