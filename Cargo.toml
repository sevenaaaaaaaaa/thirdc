[workspace]
resolver = "2"
members = [
    "kernel/crates/kernel-core",
    "kernel/crates/kernel-md",
    "kernel/crates/kernel-store",
    "kernel/crates/kernel-sync",
    "server",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
automerge = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
