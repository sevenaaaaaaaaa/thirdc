[workspace]
resolver = "2"
members = [
    "kernel/crates/kernel-core",
    "kernel/crates/kernel-md",
    "kernel/crates/kernel-store",
    "kernel/crates/kernel-sync",
    "kernel/crates/kernel-design",
    "kernel/crates/kernel-browser",
    "kernel/crates/kernel-a2ui",
    "kernel/crates/kernel-deploy",
    "server",
    "mcp",
    "cli",
    "desktop",
]
default-members = [
    "kernel/crates/kernel-core",
    "kernel/crates/kernel-md",
    "kernel/crates/kernel-store",
    "kernel/crates/kernel-sync",
    "kernel/crates/kernel-design",
    "kernel/crates/kernel-browser",
    "kernel/crates/kernel-a2ui",
    "kernel/crates/kernel-deploy",
    "server",
    "mcp",
    "cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
automerge = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "gzip", "brotli", "deflate"] }
futures-util = "=0.3.31"
futures-channel = "=0.3.31"
futures-sink = "=0.3.31"

[profile.release]
lto = "thin"
