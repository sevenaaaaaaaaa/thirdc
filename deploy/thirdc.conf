# Apache 别名：ThirdC 挂在主域下（部署约定见 OpenFlow docs/DEPLOY-CONVENTIONS.md）
# 放到 /www/server/panel/vhost/apache/extension/nownexts.com/thirdc.conf
Alias /thirdc /www/wwwroot/thirdc/web
ProxyPass /thirdc/ws ws://127.0.0.1:7700/ws
ProxyPass /thirdc/ http://127.0.0.1:7700/
ProxyPassReverse /thirdc/ http://127.0.0.1:7700/
